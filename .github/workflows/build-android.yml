name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Initialize Project & Install Plugins
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/android
        npm install -D @capacitor/cli
        npm install @capacitor-community/admob @capacitor/app

    - name: Bundle Website Files (Offline Mode)
      run: |
        mkdir www
        rsync -av --exclude='www' --exclude='android' --exclude='.git' --exclude='.github' --exclude='node_modules' ./ www/

    - name: Configure Capacitor
      run: |
        npx cap init EcoCampus com.mohit.ecocampus --web-dir www
        echo '{
          "appId": "com.mohit.ecocampus",
          "appName": "EcoCampus",
          "webDir": "www",
          "bundledWebRuntime": true
        }' > capacitor.config.json

    - name: Add Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: Inject Permissions and AdMob App ID
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        # 1. Inject Hardware Permissions
        sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>|g' $MANIFEST
        
        # 2. Inject Your Real AdMob App ID
        sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1536423251414270~6456464841" />\n</application>|g' $MANIFEST

    - name: Fix Kotlin Duplicate Classes
      run: |
        cat <<EOF >> android/build.gradle
        allprojects {
            configurations.all {
                resolutionStrategy {
                    force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                }
            }
        }
        EOF

    - name: Build Android APK
      working-directory: ./android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EcoCampus-Android-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
