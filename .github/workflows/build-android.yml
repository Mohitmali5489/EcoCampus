name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Initialize Project & Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/android
        npm install -D @capacitor/cli

    - name: Configure Capacitor & Create Dummy WebDir
      run: |
        mkdir www
        echo "<html><body>Loading EcoCampus...</body></html>" > www/index.html
        npx cap init EcoCampus com.mohit.ecocampus --web-dir www
        echo '{
          "appId": "com.mohit.ecocampus",
          "appName": "EcoCampus",
          "webDir": "www",
          "bundledWebRuntime": false,
          "server": {
            "url": "https://mohitmali5489.github.io/ecocampus/",
            "cleartext": true
          }
        }' > capacitor.config.json

    - name: Add Android Platform
      run: npx cap add android

    - name: Build Android APK
      working-directory: ./android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EcoCampus-Android-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
